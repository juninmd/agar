name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install uv
        run: pip install uv

    - name: Install uv
      run: pip install uv

    - name: Install Dependencies
      run: |
        uv pip install --system playwright
        playwright install chromium

      - name: Run Game Server
        run: |
          python -m http.server 8000 &
          echo "Server started"

    - name: Run Verification Scripts
      run: |
        python3 verify_game.py
        python3 verify_bots.py
        python3 verify_utils.py
