name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  audit:
runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install uv
        run: pip install uv

      - name: Install Dependencies
        run: |
          uv pip install --system playwright
          playwright install chromium

      - name: Run Game Server
        run: |
          python3 -m http.server 8000 &
          echo "Server started"
          sleep 3

      - name: Run Verification Scripts
        run: |
          python3 verification/verify_game.py
          python3 verification/verify_bots.py
          python3 verification/verify_utils.py
          python3 verification/verify_protocols.py
          python3 verification/verify_singularity.py
