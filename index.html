<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEON-PHAGE: O Último Byte</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Game Layer -->
    <canvas id="gameCanvas"></canvas>

    <!-- UI Layer -->
    <div id="ui-layer">
        <div id="score-board">
            <span>MEMÓRIA: </span><span id="score-display">0 KB</span>
        </div>

        <div id="start-screen" class="overlay active">
            <h1>NEON-PHAGE</h1>
            <p class="subtitle">PROTOCOLO DE SOBREVIVÊNCIA INICIADO</p>
            <p class="lore-text">Consuma dados. Evite Daemons maiores. Sobreviva à formatação.</p>
            <input type="text" id="player-name" placeholder="INSIRA ID DO SISTEMA" maxlength="12">
            <button id="start-btn">INICIAR EXECUÇÃO</button>
        </div>

        <div id="game-over-screen" class="overlay hidden">
            <h1 class="error-text">ERRO FATAL</h1>
            <p>Seu código foi sobrescrito.</p>
            <p>Massa Final: <span id="final-score">0</span> KB</p>
            <button id="restart-btn">REINICIAR SISTEMA</button>
        </div>
    </div>

    <!-- Main Entry Point -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
